<style>
:root{--font:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--acD:#ff6a00;--acL:#d94f00;--onD:#140900;--onL:#fff;--bg:#0a0a0b;--bg2:#101012;--card:#161618;--line:#28282c;--tx:#ececee;--mut:#9b9ba4;--ac:var(--acD);--on:var(--onD);--acT:color-mix(in srgb,var(--ac) 68%,#fff);--r:28px;--sh:0 18px 50px rgba(0,0,0,.35)}
:root[data-theme="light"]{--bg:#f4f6fa;--bg2:#eaeef5;--card:#fff;--line:#dce2ec;--tx:#141824;--mut:#566176;--ac:var(--acL);--on:var(--onL);--acT:color-mix(in srgb,var(--ac) 88%,#000);--sh:0 18px 40px rgba(20,24,36,.1)}
:root[data-accent="blue"]{--acD:#4da3ff;--acL:#0b63d1;--onD:#04101f}
:root[data-accent="green"]{--acD:#00d884;--acL:#0a7d4f;--onD:#04110b}
:root[data-accent="purple"]{--acD:#b18cff;--acL:#6b3fd4;--onD:#120a2a}
:root[data-accent="slate"]{--acD:#d4d4d8;--acL:#3f3f46;--onD:#0a0a0b}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.65;overflow-x:hidden}
a{color:inherit;text-decoration:none}ul{list-style:none}button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acT);outline-offset:3px;border-radius:8px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{width:min(1120px,92%);margin:0 auto}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.4rem;border-radius:99px;font-weight:600;font-size:.92rem;border:1.5px solid var(--ac);background:transparent;transition:transform .2s,color .2s,border-color .2s}
.btn.p{background:var(--ac);color:var(--on)}.btn:hover{transform:translateY(-2px)}.btn.g{border-color:var(--line)}.btn.g:hover{border-color:var(--ac);color:var(--acT)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem}
.hdr{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(1120px,94%);z-index:50;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 22px;border-radius:99px;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line)}
.logo{font-weight:700;font-size:1.05rem;margin-right:auto;letter-spacing:.02em}.logo span{color:var(--acT)}
.menu{display:flex;gap:2px}.menu a{padding:.45rem .9rem;border-radius:99px;font-size:.86rem;color:var(--mut)}.menu a:hover{color:var(--tx)}.menu a.on{background:var(--ac);color:var(--on)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;font-size:.85rem}.ib:hover{border-color:var(--ac);color:var(--acT)}
.hero{position:relative;padding:9rem 0 7rem;overflow:hidden;background:radial-gradient(60% 55% at 88% 12%,color-mix(in srgb,var(--ac) 26%,transparent),transparent 70%),radial-gradient(50% 50% at 5% 95%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%),var(--bg)}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.06;font-weight:700;letter-spacing:-.03em;margin:.4rem 0 .8rem}
.hero h1 em{font-style:normal;color:var(--acT)}.lead{max-width:50ch;color:var(--mut);margin-bottom:1.6rem}
.eyebrow{font:500 .78rem var(--mono);color:var(--acT);letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.sheet{position:relative;border-radius:56px 56px 0 0;margin-top:-56px;padding:5.5rem 0 4rem;background:var(--bg)}.sheet.alt{background:var(--bg2)}
.sh{margin-bottom:2rem}.sh h2{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700;letter-spacing:-.02em;line-height:1.2}.sh p{color:var(--mut);max-width:54ch;margin-top:.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.2rem}
.slot{display:flex;flex-direction:column;gap:.5rem;min-height:250px;transition:transform .25s,border-color .25s}.slot:hover{transform:translateY(-5px);border-color:var(--ac)}
.slot:nth-child(odd){border-radius:36px 36px 36px 12px}.slot:nth-child(even){border-radius:36px 12px 36px 36px}
.num{font:500 .8rem var(--mono);color:var(--acT)}.slot h3{font-size:1.25rem;line-height:1.25}.slot p{color:var(--mut);font-size:.9rem}.slot .go{margin-top:auto;color:var(--acT);font-weight:600;display:flex;gap:.4rem;align-items:center}
.chip{display:inline-block;padding:.25rem .8rem;border-radius:99px;border:1px solid var(--line);font-size:.78rem;color:var(--mut);width:fit-content}
.soc{display:flex;gap:.6rem}.soc a{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem;transition:.2s}.soc a:hover{background:var(--ac);color:var(--on);border-color:var(--ac);transform:translateY(-2px)}
.sub{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.2rem 0 0}
.svc{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.3rem;border-radius:99px;border:1px solid var(--line);background:var(--card);margin-bottom:.7rem}
.svc:hover{border-color:var(--ac)}.svc b{font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.2rem}
.it{overflow:hidden;padding:0;border-radius:30px}.pic{position:relative;aspect-ratio:4/3;background:var(--bg2);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}.it:hover .pic img{transform:scale(1.06)}
.it.sold .pic img{filter:grayscale(1) brightness(.55)}
.mark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.mark span{transform:rotate(-18deg);border:4px solid #fff;color:#fff;font-weight:700;font-size:2rem;letter-spacing:.2em;padding:.1rem 1rem;border-radius:12px;opacity:.9;background:rgba(225,29,72,.55)}
.inf{padding:1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.4rem}.inf h4{font-size:1rem;line-height:1.3}.pr{font:500 .95rem var(--mono);color:var(--acT)}
.gate{max-width:440px;margin:0 auto;text-align:center}.gate input{width:100%;padding:.85rem 1.2rem;border-radius:99px;border:1px solid var(--line);background:var(--bg);margin:1rem 0}
.err{color:var(--acT);min-height:1.5em;font-size:.88rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:.7rem .6rem;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.2rem}
.note li{padding:.6rem 0;border-bottom:1px solid var(--line);color:var(--mut)}
.foot{border-top:1px solid var(--line);background:var(--bg2);padding:2.2rem 0;text-align:center;color:var(--mut);font-size:.85rem}.foot b{color:var(--tx);letter-spacing:.08em}

:root[data-font="playfair"]{--font:"Playfair Display",Georgia,serif}
:root[data-font="oswald"]{--font:"Oswald","Arial Narrow",sans-serif}
:root[data-font="fredoka"]{--font:"Fredoka","Comic Sans MS",sans-serif}
:root[data-font="mono"]{--font:var(--mono)}
:root[data-font="access"]{--font:"Atkinson Hyperlegible",Verdana,sans-serif}
:root[data-size="s"]{font-size:90%}:root[data-size="l"]{font-size:112%}:root[data-size="xl"]{font-size:125%}
.pan{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 62px);right:3%;width:min(340px,94%);z-index:60;max-height:80vh;overflow:auto;padding:1.2rem;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.pan[hidden]{display:none}
.pan h5{font:500 .75rem var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin:.9rem 0 .4rem}.pan h5:first-child{margin-top:0}
.opt{display:flex;flex-wrap:wrap;gap:.4rem}
.seg{padding:.35rem .8rem;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:.82rem}.seg[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}.sw[aria-pressed="true"]{border-color:var(--tx);outline:2px solid var(--ac)}
.sw[data-v=orange]{background:#ff6a00}.sw[data-v=blue]{background:#4da3ff}.sw[data-v=green]{background:#00d884}.sw[data-v=purple]{background:#b18cff}.sw[data-v=slate]{background:#d4d4d8}
.slw{margin-top:2.4rem}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:40px;border:1px solid var(--line)}.car::-webkit-scrollbar{display:none}
.sl{position:relative;flex:0 0 100%;scroll-snap-align:start;aspect-ratio:16/8;min-height:270px;display:block}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:.4rem;padding:1.6rem 2rem;background:linear-gradient(0deg,rgba(6,6,7,.9),rgba(6,6,7,.1) 70%);color:#fff}
.ov h3{font-size:clamp(1.4rem,3.5vw,2.2rem)}.ov p{max-width:46ch;font-size:.92rem;opacity:.85}.ov .btn{width:fit-content;margin-top:.4rem}
.dots{display:flex;justify-content:center;gap:8px;margin-top:.9rem}.dot{width:8px;height:8px;padding:0;border:0;border-radius:99px;background:var(--line);transition:.25s}.dot.on{width:24px;background:var(--ac)}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:2rem}.det div{display:flex;flex-direction:column}.mut{color:var(--mut);font-size:.88rem}
.cart{margin-bottom:1.5rem;border-color:var(--ac)}.cart h3{margin-bottom:.8rem}.cart .pr{margin:.6rem 0 1rem;font-size:1.1rem}
.bar{justify-content:space-between;margin-bottom:1rem}
.cols.sm{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.stat b{display:block;font-size:1.35rem;margin-top:.5rem}
.sec{margin:1.8rem 0 .8rem}

/* loader, progress bar, skeleton shimmer */
.ld{display:grid;justify-items:center;gap:1.1rem;padding:7rem 1.5rem 8rem;text-align:center;color:var(--mut)}
.ldr{position:relative;width:128px;height:128px}
.ldr i{position:absolute;border-radius:50%;border:2px solid transparent}
.ldr i:nth-child(1){inset:0;border-top-color:var(--ac);border-right-color:var(--ac);filter:drop-shadow(0 0 8px var(--ac));animation:ldspin 1.1s cubic-bezier(.55,.1,.45,.9) infinite}
.ldr i:nth-child(2){inset:16px;border-bottom-color:var(--acT);border-left-color:var(--acT);animation:ldspin 1.7s linear infinite reverse}
.ldr i.ldl{inset:34px;border:0;border-radius:20px;background:var(--brand) center/cover no-repeat;animation:ldpulse 1.6s ease-in-out infinite;box-shadow:0 0 30px color-mix(in srgb,var(--ac) 55%,transparent)}
.ldt{font:700 1.05rem var(--font);letter-spacing:.45em;text-indent:.45em;background:linear-gradient(90deg,var(--tx) 0,var(--acT) 50%,var(--tx) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:ldshine 2.2s linear infinite}
.ldm{font:500 .76rem var(--mono);letter-spacing:.16em;text-transform:uppercase}
.ldb{width:200px;height:3px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.ldb::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:99px;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:ldbar 1.15s ease-in-out infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
@keyframes ldpulse{0%,100%{transform:scale(.93)}50%{transform:scale(1.05)}}
@keyframes ldshine{to{background-position:-220% 0}}
@keyframes ldbar{0%{left:-40%}100%{left:100%}}
.tbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,transparent 0,var(--ac) 45%,var(--acT) 55%,transparent 100%);box-shadow:0 0 14px var(--ac);transform:translateX(-100%)}
.tbar.on{opacity:1;animation:tbar 1s ease-in-out infinite}
@keyframes tbar{to{transform:translateX(100%)}}
.sk{background:linear-gradient(100deg,var(--bg2) 30%,color-mix(in srgb,var(--ac) 16%,var(--bg2)) 50%,var(--bg2) 70%);background-size:220% 100%;animation:sksh 1.3s linear infinite}
@keyframes sksh{to{background-position:-220% 0}}
img.fd{opacity:0;transition:opacity .45s}img.fd.in{opacity:1}.pic img.fd{transition:opacity .45s,transform .4s}
.btn.busy{pointer-events:none;opacity:.85}.btn.busy::after{content:"";width:1em;height:1em;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:ldspin .7s linear infinite}
