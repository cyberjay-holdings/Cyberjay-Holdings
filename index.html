if(b.verified)return h("p","lead","You are a Verified Seller \u2713");
if(b.plan==="free"){w.append(h("p","mut","The Verified Seller badge is available on the Standard and Premium plans. Upgrade in the Plan tab first."));return w}
if(v&&v.status==="pending"){w.append(h("p","lead","Your ID is being reviewed by the holding admin. The badge appears once it is approved."));return w}
if(v&&v.status==="rejected")w.append(h("p","err","Your last submission was not approved. Make sure the photos are clear and the name matches "+b.ceo+", then try again."));
w.append(h("p","mut","Upload clear photos of the FRONT and BACK of your National ID. The name must match the owner name on your profile ("+b.ceo+"). Only the holding admin can see them, and they are deleted after the review."));
w.append(form([["f","ID front","file"],["k","ID back","file"],["ok","Do you agree to this?","select","no",[["no","No"],["yes","Yes, I agree"]]]],"Submit for verification",async o=>{
if(o.ok!=="yes")throw new Error("Choose Yes, I agree to continue");if(!o.f||!o.k)throw new Error("Choose both the front and the back photo");
const id=crypto.randomUUID(),pf=b.uid+"/front-"+id+".jpg",pk=b.uid+"/back-"+id+".jpg";
await db(sb.storage.from("id-docs").upload(pf,await rz(o.f,1600),{contentType:"image/jpeg"}));await db(sb.storage.from("id-docs").upload(pk,await rz(o.k,1600),{contentType:"image/jpeg"}));
await db(sb.from("verifications").upsert({business_id:b.uid,status:"pending",front:pf,back:pk,submitted_at:new Date().toISOString(),decided_at:null,note:""}));await loadX();flash="Submitted. The holding admin will review your ID.";paint()}));return w}
function plansV(){const w=h("div"),L=PR.filter(x=>x.status==="requested");w.append(h("h3","sec","Plan requests"));if(!L.length)w.append(h("p","mut","No plan requests waiting."));
L.forEach(q=>{const b=S.biz.find(x=>x.uid===q.business_id);if(!b||!PL[q.plan])return;const c=h("div","card rowc"),r=h("div","row"),ok=h("button","btn p","Agree and activate "+PL[q.plan].n),no=h("button","btn g","Decline");
c.append(h("h4","",b.name),h("p","mut","Requested "+PL[q.plan].n+" (now "+PL[b.plan].n+"). Confirm you received the payment first."));
ok.addEventListener("click",async()=>{try{await db(sb.from("businesses").update({plan:q.plan}).eq("id",b.uid));await db(sb.from("plan_requests").update({status:"active",decided_at:new Date().toISOString()}).eq("id",q.id));await refresh();await loadX();flash=b.name+" is now on the "+PL[q.plan].n+" plan."}catch(e){flash=e.message}paint()});
no.addEventListener("click",async()=>{try{await db(sb.from("plan_requests").update({status:"declined",decided_at:new Date().toISOString()}).eq("id",q.id));await loadX();flash="Request declined."}catch(e){flash=e.message}paint()});
r.append(ok,no);c.append(r);w.append(c)});
w.append(h("h3","sec","Set a plan directly"));
S.biz.forEach(b=>w.append(form([["pl","Plan for "+b.name,"select",b.plan,[["free","Free"],["standard","Standard"],["premium","Premium"]]]],"Save plan",async o=>{if(!["free","standard","premium"].includes(o.pl))throw new Error("Invalid plan");await db(sb.from("businesses").update({plan:o.pl}).eq("id",b.uid));await refresh();flash=b.name+" is now on the "+PL[o.pl].n+" plan.";paint()})));return w}
function verV(){const w=h("div"),L=VR.filter(x=>x.status==="pending");if(!L.length)w.append(h("p","mut","No ID verifications waiting."));
L.forEach(v=>{const b=S.biz.find(x=>x.uid===v.business_id);if(!b)return;const c=h("div","card rowc"),r=h("div","row"),box=h("div"),ap=h("button","btn p","Approve (ID matches)"),rj=h("button","btn g","Reject");
c.append(h("h4","",b.name),h("p","mut","Registered owner name: "+b.ceo+". Approve only if the ID shows the same name and the photos look genuine."));
const show=(label,path)=>{const x=h("button","btn g",label);x.addEventListener("click",async()=>{const q=await sb.storage.from("id-docs").createSignedUrl(path,120);if(q.error||!q.data||!String(q.data.signedUrl).startsWith(SB_URL+"/storage/v1/")){flash="Could not open the photo.";paint();return}const im=h("img","idimg");im.src=q.data.signedUrl;im.alt=label;box.replaceChildren(im)});return x};
const done=async ok=>{try{await sb.storage.from("id-docs").remove([v.front,v.back]);await db(sb.from("verifications").update({status:ok?"approved":"rejected",front:"",back:"",decided_at:new Date().toISOString()}).eq("business_id",v.business_id));await db(sb.from("businesses").update({verified:ok}).eq("id",b.uid));await refresh();await loadX();flash=b.name+(ok?" is now a Verified Seller. The ID photos were deleted.":" was not verified. The ID photos were deleted.")}catch(e){flash=e.message}paint()};
ap.addEventListener("click",()=>done(true));rj.addEventListener("click",()=>done(false));
r.append(show("View ID front",v.front),show("View ID back",v.back),ap,rj);c.append(r,box);w.append(c)});return w}
function regV(){return form([["name","Business name"],["tag","Category"],["sells","What it sells"],["ceo","CEO / owner name"],["loc","Location"],["hrs","Opening hours"],["since","Since (year)"],["wa","WhatsApp (2547XXXXXXXX)"],["ig","Instagram handle"],["email","Owner's login email"],["pw","Owner's temporary password (10+ characters)","password"]],"Register business",async o=>{
nm(o.name,"Business name",2,60);nm(o.tag,"Category",2,60);nm(o.sells,"Description",3,160);nm(o.ceo,"CEO",2,80);contactCk(o);if(!emailOk(o.email))throw new Error("Enter the owner's real email");if(o.pw.length<10)throw new Error("Password needs 10+ characters");
const r=await sb.functions.invoke("create-business",{body:{name:o.name,tag:o.tag,sells:o.sells,ceo:o.ceo,loc:o.loc,hrs:o.hrs,since:o.since,wa:o.wa,ig:o.ig,email:o.email.toLowerCase(),password:o.pw}});
if(r.error){let m="Could not register. Try again.";try{const e=await r.error.context.json();if(e&&e.error)m=e.error}catch(x){}throw new Error(m)}
await refresh();flash=o.name+" registered. Give the owner their email and the temporary password.";tab="biz";paint()})}

/* ---------- router ---------- */
function loadErr(){const d=h("div","load");d.append(h("p","","We could not load the businesses. Check your internet connection and try again."));const b=h("button","btn p","Try again");b.addEventListener("click",()=>location.reload());d.append(b);return d}
async function route(keep){const id=++rid;clearInterval(timer);const y=scrollY,hs=location.hash.replace(/^#\/?/,"").split("/"),k=hs[0];
if(!keep&&k!=="about"&&ready&&Date.now()-last>3e4)refresh().then(ch=>{if(ch&&id===rid)route(true)});
if(!ready&&k!=="about"){app.replaceChildren(h("p","load",fail||"Loading\u2026"));await refresh();if(id!==rid)return;if(!ready){app.replaceChildren(loadErr());return}}
let v,n="home";
if(k==="b"){const b=S.biz.find(x=>x.id===hs[1]);if(b){v=biz(b);n="b";document.title=b.name+" | CYBERJAY Holdings"}}
else if(k==="about"){v=about();n="about"}else if(k==="chamber"){v=chamber();n="chamber"}else if(k==="join"){v=join();n="join"}else if(k==="terms"){v=terms();n="terms"}
if(!v){v=home();n="home"}if(n==="home")document.title="CYBERJAY Holdings | Businesses & Marketplace";
app.replaceChildren(v);document.querySelectorAll("#menu a").forEach(a=>a.classList.toggle("on",a.dataset.r===n));
if(keep)scrollTo({top:y,behavior:"instant"});else{scrollTo({top:0,behavior:"instant"});$("#pan").hidden=true}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-scroll]");if(t){const el=document.getElementById(t.dataset.scroll);if(el)el.scrollIntoView({behavior:"smooth"})}});
$("#yr").textContent=new Date().getFullYear();
addEventListener("hashchange",()=>route());
(async()=>{try{const c=JSON.parse(sessionStorage.getItem("cj-c4"));if(Array.isArray(c)&&c.length){S.biz=c;ready=true;route(true)}}catch(e){}
await refresh();await restore();route(true)})();
</script>
